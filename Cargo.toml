[workspace]
resolver = "2"
members = ["crates/core", "crates/node"]
# crates/pyo3 (the PyO3 extension → pypaginate._core) is built ONLY by maturin,
# never as a workspace member. Excluding it keeps `cargo test --workspace` from
# linking libpython on a Python-less runner; its `{ path = "../core" }` dep
# still resolves (path deps do not require workspace membership).
# crates/wasm (the wasm-bindgen binding for the docs playground) is likewise
# excluded — it builds only for wasm32 and would otherwise pull wasm-bindgen into
# native `cargo --workspace` runs.
exclude = ["crates/pyo3", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["pypaginate Contributors"]
repository = "https://github.com/CybLow/paginate"
rust-version = "1.74"

[workspace.dependencies]
base64 = "0.23"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
unicode-normalization = "0.1"

[workspace.lints.clippy]
# Mirror CI's `-D warnings` in local builds, plus a few high-value pedantic lints.
all = { level = "deny", priority = -1 }
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"

# Release profile for the workspace crates (engine rlib + napi addon).
# NOTE: panic = "unwind" (the default) is kept deliberately so PyO3 can catch
# Rust panics at the FFI boundary and turn them into Python exceptions instead
# of aborting the host interpreter. (crates/pyo3 carries its own profile.)
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# Strip symbols from the shipped artifacts (the napi addon + engine rlib), for
# parity with the pyo3 wheel's profile and a smaller published binary.
strip = true
