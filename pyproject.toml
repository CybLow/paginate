[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

# ==========================
# PROJECT METADATA (PEP 621)
# ==========================
[project]
name = "pypaginate"
version = "0.2.0"
description = "Universal pagination toolkit for Python — one function, any backend, auto-detects sync/async"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "CybLow", email = "cyber_lolow@protonmail.com" }]
maintainers = [{ name = "CybLow", email = "cyber_lolow@protonmail.com" }]
keywords = [
    "pagination",
    "filtering",
    "search",
    "sqlalchemy",
    "async",
    "cursor",
    "keyset",
    "jsonlogic",
    "orm",
    "database",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Framework :: FastAPI",
    "Typing :: Typed",
    "Environment :: Web Environment",
]

# Core: only pydantic (models, validation, serialization)
dependencies = [
    "pydantic>=2.0.0",
]

# ==========================
# OPTIONAL DEPENDENCIES (extras)
# ==========================
[project.optional-dependencies]
# Individual features
sqlalchemy = [
    "SQLAlchemy[asyncio]>=2.0.0",
    "sqlakeyset>=2.0",
]
search = [
    "rapidfuzz>=3.0.0",
]
fastapi = [
    "fastapi>=0.95.0",
]

# Combo extras
all = [
    "pypaginate[sqlalchemy,search,fastapi]",
]

# ==========================
# CONSOLE SCRIPTS (uv run <cmd>)
# ==========================
[project.scripts]
pypaginate = "pypaginate._cli:main"

# ==========================
# PROJECT URLS
# ==========================
[project.urls]
Homepage = "https://github.com/CybLow/pypaginate"
Documentation = "https://pypaginate.readthedocs.io"
Repository = "https://github.com/CybLow/pypaginate"
Issues = "https://github.com/CybLow/pypaginate/issues"
Changelog = "https://github.com/CybLow/pypaginate/blob/main/CHANGELOG.md"

# ==========================
# DEPENDENCY GROUPS (PEP 735 - dev only)
# ==========================
[dependency-groups]
# All dev dependencies
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "security" },
    { include-group = "build" },
    "fastapi-filter>=2.0.1",
    "fastapi-pagination>=0.15.10",
    "paginate>=0.5.7",
    "pip-audit>=2.10.0",
    "radon>=6.0.1",
    "sqlalchemy-pagination>=0.0.2",
    "vulture>=2.14",
]
# Testing - Core
test = [
    # Core testing framework
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",

    # Parallel execution
    "pytest-xdist>=3.6.1",

    # Property-based testing
    "hypothesis>=6.100.0",

    # Mutation testing
    "mutmut>=3.0.0",

    # Performance benchmarking
    "pytest-benchmark>=4.0.0",

    # Snapshot testing
    "syrupy>=4.6.0",

    # Test utilities
    "factory-boy>=3.3.0",
    "faker>=28.0.0",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.3.0",
    "pytest-rerunfailures>=14.0",

    # Coverage
    "coverage[toml]>=7.6.0",

    # Database testing
    "aiosqlite>=0.20.0",

    # HTTP testing
    "httpx>=0.28.1",

    # Async support
    "greenlet>=3.0.0",
    "anyio>=4.0.0",
]
# Linting & Formatting
lint = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]
# Type Checking
type = [
    "mypy>=1.13.0",
]
# Security Scanning
security = [
    "bandit[toml]>=1.8.0",
]
# Building & Publishing
build = [
    "build>=1.2.2",
    "twine>=6.0.1",
]
# Documentation (Sphinx + RTD theme)
# Note: sphinx-autodoc-typehints>=3.6.2 requires Python 3.12+
# Build docs with Python 3.12+ for best results
docs = [
    # Core Sphinx (latest version)
    "sphinx>=9.0",
    "sphinx-rtd-theme>=3.0",
    
    # Modern UX extensions
    "sphinx-design>=0.6",              # Cards, grids, tabs, dropdowns
    "sphinx-copybutton>=0.5",          # Copy button on code blocks
    # Use version with deprecation fixes on Python 3.12+, older on 3.11
    "sphinx-autodoc-typehints>=3.6.2; python_version >= '3.12'",
    "sphinx-autodoc-typehints>=3.6.1,<3.6.2; python_version < '3.12'",
    "sphinx-autoapi>=3.6.0",            # Auto-generate API docs from source
    
    # Markdown support
    "myst-parser>=4.0",                # Full Markdown support
    
    # Diagrams & extras
    "sphinxcontrib-mermaid>=0.9",      # Mermaid diagrams
    "sphinxext-opengraph>=0.9",        # Social preview cards
    "sphinx-notfound-page>=1.0",       # Custom 404 page
    
    # Versioning for releases (modern alternative to sphinx-multiversion)
    "sphinx-polyversion>=2.0",         # Multi-version docs builder
    "jinja2>=3.0",                     # Required for polyversion templates
    
    # All optional dependencies for complete autodoc
    "SQLAlchemy>=2.0.45",
    "sqlakeyset>=2.0.1762907931",
    "rapidfuzz>=3.14.3",
    "json-logic-qubit>=0.9.1",
    "jmespath>=1.0.1",
    "fastapi>=0.127.0",
]
# MCP server dependencies (for .opencode/scripts)
mcp = [
    "mcp>=1.0.0",
    "psycopg2-binary>=2.9.11",
    "sentence-transformers>=5.2.2",
    "cocoindex>=0.1.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
]

# ==========================
# UV CONFIGURATION
# ==========================
[tool.uv]
package = true
default-groups = ["dev"]  # docs group requires Python 3.12+, mcp is optional (heavy ML deps)

# Cache optimization
cache-keys = [{ file = "pyproject.toml" }, { file = "uv.lock" }]

# ==========================
# HATCH BUILD CONFIGURATION
# ==========================
[tool.hatch.build.targets.wheel]
packages = ["src/pypaginate"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "py.typed",
]

# ==========================
# RUFF CONFIGURATION
# ==========================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.pyi"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "S",     # bandit (security)
    "A",     # flake8-builtins
    "DTZ",   # flake8-datetimez
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "ERA",   # eradicate (commented code)
    "PL",    # pylint
    "TRY",   # tryceratops
    "PERF",  # performance lints
    "ASYNC", # async lints
    "LOG",   # logging best practices
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "TRY003",  # raise vanilla exception messages
    "PLR0913", # too many arguments (pragmatic for pagination config)
    "PLR2004", # magic value comparison (common in pagination)
    "PLR0911", # too many return statements (acceptable for SQL adapters)
    "PLR0912", # too many branches (acceptable for SQL adapters)
    "PLC0105", # TypeVar naming convention (ResultT, ItemT are valid)
    "PLC0415", # import not at top-level (intentional for optional deps)
    "N818",    # exception name should end with Error (Exception suffix is valid)
    "RET505",  # unnecessary else after return
    "RET504",  # unnecessary assignment before return
    "SIM108",  # use ternary operator (readability preference)
    "ARG002",  # unused method argument (common in base classes)
    "S105",    # hardcoded password (false positive on token constants)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403", "ARG001"]
"tests/**/*.py" = ["S101", "ARG001", "PLR2004", "C901", "B017", "E402", "B008"]
"examples/**/*.py" = ["S101", "T201"]
"src/pypaginate/_cli.py" = ["T201", "S603", "S607"]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
known-first-party = ["pypaginate"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ==========================
# MYPY CONFIGURATION
# ==========================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Too many false positives with SQLAlchemy
warn_no_return = true
show_error_codes = true
show_column_numbers = true
pretty = true
exclude = ["build", "dist", ".venv"]

[[tool.mypy.overrides]]
module = [
    "json_logic.*",
    "json_logic_qubit.*",
    "jmespath.*",
    "text_unidecode.*",
    "rapidfuzz.*",
    "sqlakeyset.*",
    "sqlalchemy.*",
    "fastapi.*",
    "pydantic.*",
    "pyparsing.*",
    "pypaginate.core",
    "pypaginate.core.*",
    "pypaginate.query",
    "pypaginate.query.*",
]
ignore_missing_imports = true

# Relax strict checking for files with heavy SQLAlchemy/Pydantic usage
[[tool.mypy.overrides]]
module = [
    "pypaginate.dependencies",
    "pypaginate.integrations.fastapi",
    "pypaginate.text.pipelines",
    "pypaginate.filters.search.helpers",
    "pypaginate",
]
disable_error_code = ["misc", "no-any-return", "import-untyped"]

# ==========================
# PYTEST CONFIGURATION
# ==========================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

# Async configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Enhanced CLI options
addopts = [
    "-ra",                       # Show extra summary for all except passed
    "--strict-markers",          # Fail on unknown markers
    "--strict-config",           # Fail on config errors
    "--tb=short",                # Short traceback
    "-q",                        # Quiet output
    "--durations=10",            # Show 10 slowest tests
    "--durations-min=0.5",       # Only show tests > 0.5s
]

# Filter warnings
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # SQLAlchemy async resource cleanup warnings on Windows
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::ResourceWarning",
]

# Comprehensive markers
markers = [
    # Test types
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (database, real deps)",
    "e2e: End-to-end scenario tests",
    "property: Property-based tests using Hypothesis",
    "benchmark: Performance benchmark tests",
    "snapshot: Snapshot comparison tests",

    # Feature categories
    "sqlalchemy: Tests requiring SQLAlchemy",
    "fastapi: Tests requiring FastAPI",
    "search: Tests for search features",
    "filters: Tests for filter features",
    "sorting: Tests for sorting features",
    "keyset: Tests for keyset pagination",

    # Execution hints
    "slow: Slow running tests (>1s)",
    "stress: Stress tests with large datasets",
    "flaky: Known flaky tests requiring retry",
    "skip_ci: Skip in CI (local only)",
]

# Test collection patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ==========================
# HYPOTHESIS CONFIGURATION
# ==========================
[tool.hypothesis]
deadline = 500
max_examples = 100
suppress_health_check = ["too_slow"]
database = "tests/.hypothesis"

# ==========================
# COVERAGE CONFIGURATION
# ==========================
[tool.coverage.run]
source = ["src/pypaginate"]
branch = true
parallel = true
concurrency = ["multiprocessing", "thread"]
data_file = ".coverage"
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/migrations/*",
    "*/_cli/*",
]

[tool.coverage.paths]
source = ["src/pypaginate", "*/site-packages/pypaginate"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
    "\\.\\.\\.",
]
partial_branches = [
    "pragma: no branch",
]

[tool.coverage.html]
directory = "htmlcov"
title = "pypaginate Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

# ==========================
# MUTMUT CONFIGURATION
# ==========================
[tool.mutmut]
paths_to_mutate = "src/pypaginate"
tests_dir = "tests/"
runner = "pytest -x -q --tb=no"
dict_synonyms = ["Struct", "NamedTuple"]

# ==========================
# BANDIT CONFIGURATION
# ==========================
[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "docs", "examples", ".opencode", ".claude"]
skips = ["B101", "B404", "B603"]  # B101: assert, B404/B603: subprocess in _cli.py
