services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pypaginate
      POSTGRES_PASSWORD: pypaginate
      POSTGRES_DB: pypaginate_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pypaginate"]
      interval: 2s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data
