# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Monorepo: the Python package + Sphinx site live under py/. The docs are built
# by sphinx-autoapi, which parses py/src/pypaginate STATICALLY (no import), and
# conf.py hardcodes the version — so RTD needs neither Rust nor the compiled
# pypaginate._core extension. We install the docs deps only (not the project),
# which keeps builds fast and free of native-toolchain failures.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    # Install the docs group + all extras (so type references resolve). The
    # project itself is NOT installed — autoapi reads the source tree.
    - $HOME/.local/bin/uv sync --no-install-project --group docs --all-extras --directory py
    # --no-sync so `uv run` uses the env above as-is and does NOT re-install the
    # project (which would require building the Rust extension).
    - $HOME/.local/bin/uv run --no-sync --directory py sphinx-build -b html docs $READTHEDOCS_OUTPUT/html

# Ignored when build.commands is set, but kept for clarity/tooling.
sphinx:
  configuration: py/docs/conf.py
  fail_on_warning: false
