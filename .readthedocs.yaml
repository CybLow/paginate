# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Monorepo: the Python package + Sphinx site live under py/. Docs are generated
# by sphinx-autoapi, which parses py/src/pypaginate STATICALLY (no import), and
# conf.py hardcodes the version — so the build needs neither Rust nor the
# compiled pypaginate._core extension. We install the docs deps only (not the
# project) for fast, dependency-light builds.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    # docs group + all extras (so type references resolve); --no-install-project
    # skips building pypaginate itself (autoapi reads the source).
    - $HOME/.local/bin/uv sync --group docs --all-extras --no-install-project --directory py
    - $HOME/.local/bin/uv run --directory py sphinx-build -b html docs $READTHEDOCS_OUTPUT/html

# Ignored when build.commands is set, but kept for clarity/tooling.
sphinx:
  configuration: py/docs/conf.py
  fail_on_warning: false
