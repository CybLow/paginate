[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# ==========================
# PROJECT METADATA (PEP 621)
# ==========================
[project]
name = "pypaginate"
version = "1.0.0"
description = "Universal pagination toolkit for Python — one function, any backend, auto-detects sync/async"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "CybLow", email = "cyber_lolow@protonmail.com" }]
maintainers = [{ name = "CybLow", email = "cyber_lolow@protonmail.com" }]
keywords = [
    "pagination",
    "filtering",
    "sorting",
    "search",
    "sqlalchemy",
    "fastapi",
    "async",
    "cursor-pagination",
    "keyset-pagination",
    "offset-pagination",
    "orm",
    "pydantic",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
    "Environment :: Web Environment",
]

# Core: zero runtime dependencies — the engine + the type shapes live in the
# native `_core` extension (bundled in the wheel). Pydantic is only needed by the
# [fastapi] extra; SQLAlchemy/Django adapters are Pydantic-free.
dependencies = []

# ==========================
# OPTIONAL DEPENDENCIES (extras)
# ==========================
[project.optional-dependencies]
# Individual features
sqlalchemy = [
    "SQLAlchemy[asyncio]>=2.0.0",
]
search = [
    # Ranked + fuzzy/token-sort search now runs in the native `_core` engine;
    # no extra Python dependency is needed. Kept as a no-op for compatibility.
]
fastapi = [
    "fastapi>=0.95.0",
    "pydantic>=2.0.0",
]
django = [
    "Django>=4.2",
]
security = [
    "google-re2>=1.0",
]

# Combo extras
all = [
    "pypaginate[sqlalchemy,search,fastapi,django]",
]

# ==========================
# PROJECT URLS
# ==========================
[project.urls]
Homepage = "https://github.com/CybLow/paginate"
Documentation = "https://cyblow.github.io/paginate/"
Repository = "https://github.com/CybLow/paginate"
Issues = "https://github.com/CybLow/paginate/issues"
Changelog = "https://github.com/CybLow/paginate/blob/main/CHANGELOG.md"

# ==========================
# DEPENDENCY GROUPS (PEP 735 - dev only)
# ==========================
[dependency-groups]
# All dev dependencies
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "security" },
    { include-group = "build" },
    "fastapi-filter>=2.0.1",
    "fastapi-pagination>=0.15.10",
    "paginate>=0.5.7",
    "pip-audit>=2.10.0",
    "radon>=6.0.1",
    "sqlalchemy-pagination>=0.0.2",
    "vulture>=2.14",
]
# Testing - Core
test = [
    # Core testing framework
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",

    # Parallel execution
    "pytest-xdist>=3.6.1",

    # Property-based testing
    "hypothesis>=6.100.0",

    # Mutation testing
    "mutmut>=3.0.0",

    # Performance benchmarking
    "pytest-benchmark>=4.0.0",

    # Snapshot testing
    "syrupy>=4.6.0",

    # Test utilities
    "factory-boy>=3.3.0",
    "faker>=28.0.0",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.3.0",
    "pytest-rerunfailures>=14.0",

    # Coverage
    "coverage[toml]>=7.6.0",

    # Database testing
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "Django>=4.2",

    # HTTP testing
    "httpx>=0.28.1",

    # Async support
    "greenlet>=3.0.0",
    "anyio>=4.0.0",
]
# Linting & Formatting
lint = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]
# Type Checking
type = [
    "ty>=0.0.44",
]
# Security Scanning
security = [
    "bandit[toml]>=1.8.0",
]
# Building & Publishing
build = [
    "build>=1.2.2",
    "twine>=6.0.1",
]
# MCP server dependencies (for .opencode/scripts)
mcp = [
    "mcp>=1.0.0",
    "psycopg2-binary>=2.9.11",
    "sentence-transformers>=5.2.2",
    "cocoindex>=0.1.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
]

# ==========================
# UV CONFIGURATION
# ==========================
[tool.uv]
package = true
default-groups = ["dev"]  # mcp is optional (heavy ML deps)

# Cache optimization
cache-keys = [{ file = "pyproject.toml" }, { file = "uv.lock" }]

# ==========================
# MATURIN BUILD CONFIGURATION
# ==========================
# pypaginate is a mixed Python/Rust package: the Python lives at src/pypaginate/
# and the Rust binding crate (crates/pyo3, see manifest-path below) compiles to
# the bundled extension module `pypaginate._core`.
[tool.maturin]
python-source = "src"
# The PyO3 binding crate lives at crates/pyo3 (sibling of py/), so point maturin
# at it explicitly. It is excluded from the cargo workspace and built standalone.
manifest-path = "../crates/pyo3/Cargo.toml"
module-name = "pypaginate._core"
features = ["pyo3/extension-module"]

# ==========================
# RUFF CONFIGURATION
# ==========================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# `*.pyi` is the (generated) native stub; `_generated/` is machine-generated from
# the Rust JSON Schema (`just gen`) and is exempt from the project's style rules.
extend-exclude = ["*.pyi", "**/_generated/**"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "S",     # bandit (security)
    "A",     # flake8-builtins
    "DTZ",   # flake8-datetimez
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "ERA",   # eradicate (commented code)
    "PL",    # pylint
    "TRY",   # tryceratops
    "PERF",  # performance lints
    "ASYNC", # async lints
    "LOG",   # logging best practices
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "TRY003",  # raise vanilla exception messages
    "PLR0913", # too many arguments (pragmatic for pagination config)
    "PLR2004", # magic value comparison (common in pagination)
    "PLR0911", # too many return statements (acceptable for SQL adapters)
    "PLR0912", # too many branches (acceptable for SQL adapters)
    "PLC0105", # TypeVar naming convention (ResultT, ItemT are valid)
    "PLC0415", # import not at top-level (intentional for optional deps)
    "N818",    # exception name should end with Error (Exception suffix is valid)
    "RET505",  # unnecessary else after return
    "RET504",  # unnecessary assignment before return
    "SIM108",  # use ternary operator (readability preference)
    "ARG002",  # unused method argument (common in base classes)
    "S105",    # hardcoded password (false positive on token constants)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403", "ARG001"]
# A004: tests import the public `filter` helper (intentionally shadows the builtin).
"tests/**/*.py" = ["S101", "ARG001", "PLR2004", "C901", "B017", "E402", "B008", "A004"]
"examples/**/*.py" = ["S101", "T201"]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
known-first-party = ["pypaginate"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ==========================
# TYPE CHECKING (ty — Astral's checker; replaces mypy)
# ==========================
# ty resolves the project's installed dependencies and checks src/ strictly.
# Untyped third-party packages (Django, etc.) are handled gracefully without
# per-module ignore_missing_imports overrides. Boundary narrowing uses explicit
# typing.cast(...) at the call site rather than blanket suppressions.
[tool.ty.environment]
python-version = "3.11"

# ==========================
# PYTEST CONFIGURATION
# ==========================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

# Async configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Enhanced CLI options
addopts = [
    "-ra",                       # Show extra summary for all except passed
    "--strict-markers",          # Fail on unknown markers
    "--strict-config",           # Fail on config errors
    "--tb=short",                # Short traceback
    "-q",                        # Quiet output
    "--durations=10",            # Show 10 slowest tests
    "--durations-min=0.5",       # Only show tests > 0.5s
]
junit_family = "legacy"

# Filter warnings
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # SQLAlchemy async resource cleanup warnings on Windows
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::ResourceWarning",
]

# Comprehensive markers
markers = [
    # Test types
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (database, real deps)",
    "e2e: End-to-end scenario tests",
    "property: Property-based tests using Hypothesis",
    "benchmark: Performance benchmark tests",
    "snapshot: Snapshot comparison tests",

    # Feature categories
    "sqlalchemy: Tests requiring SQLAlchemy",
    "fastapi: Tests requiring FastAPI",
    "search: Tests for search features",
    "filters: Tests for filter features",
    "sorting: Tests for sorting features",
    "keyset: Tests for keyset pagination",

    # Execution hints
    "postgresql: Tests requiring a running PostgreSQL instance",
    "slow: Slow running tests (>1s)",
    "stress: Stress tests with large datasets",
    "flaky: Known flaky tests requiring retry",
    "skip_ci: Skip in CI (local only)",
]

# Test collection patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ==========================
# HYPOTHESIS CONFIGURATION
# ==========================
[tool.hypothesis]
deadline = 500
max_examples = 100
suppress_health_check = ["too_slow"]
database = "tests/.hypothesis"

# ==========================
# COVERAGE CONFIGURATION
# ==========================
[tool.coverage.run]
source = ["src/pypaginate"]
branch = true
parallel = true
concurrency = ["multiprocessing", "thread"]
data_file = ".coverage"
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.paths]
source = ["src/pypaginate", "*/site-packages/pypaginate"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
    "\\.\\.\\.",
]
partial_branches = [
    "pragma: no branch",
]

[tool.coverage.html]
directory = "htmlcov"
title = "pypaginate Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

# ==========================
# MUTMUT CONFIGURATION
# ==========================
[tool.mutmut]
paths_to_mutate = "src/pypaginate"
tests_dir = "tests/"
runner = "pytest -x -q --tb=no"
dict_synonyms = ["Struct", "NamedTuple"]

# ==========================
# BANDIT CONFIGURATION
# ==========================
[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "docs", "examples", ".opencode", ".claude"]
skips = ["B101"]  # B101: assert
