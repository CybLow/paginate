<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 
    pypaginate Favicon - "Ocean Blue" Color Scheme
    Simplified square version for browser tabs
  -->
  
  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#4A7C9B"/>
  
  <!-- Stacked pages (simplified) -->
  <rect x="6" y="9" width="14" height="17" rx="2" fill="#E3F2FD" opacity="0.5"/>
  <rect x="9" y="6" width="14" height="17" rx="2" fill="white"/>
  
  <!-- Data lines on front page -->
  <line x1="11" y1="10" x2="21" y2="10" stroke="#4A7C9B" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="14" x2="19" y2="14" stroke="#6B9AB8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="18" x2="21" y2="18" stroke="#6B9AB8" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Small navigation arrow -->
  <path d="M21 24 L26 28 L21 32" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, -4)"/>
</svg>
