# Codecov configuration for the paginate monorepo
# https://docs.codecov.io/docs/codecov-yaml

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: 85%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%

# pytest runs with working-directory: py, so coverage reports paths as
# `src/pypaginate/...`; map them back to the repo-root location.
fixes:
  - "src/::py/src/"

flags:
  unit:
    paths:
      - py/src/pypaginate/
    carryforward: true
  integration:
    paths:
      - py/src/pypaginate/
    carryforward: true

component_management:
  individual_components:
    - component_id: python
      paths: [py/src/pypaginate/**, crates/pyo3/**]
    - component_id: engine
      paths: [crates/core/**]
    - component_id: node
      paths: [crates/node/**, ts/src/**]

comment:
  layout: "reach,diff,flags,components"
  behavior: default
  require_changes: false
