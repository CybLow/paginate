# MkDocs Configuration for pypaginate
# Documentation: https://www.mkdocs.org/

site_name: pypaginate
site_description: Advanced pagination, filtering, and search toolkit for Python
site_author: CybLow
site_url: https://pypaginate.readthedocs.io

repo_name: CybLow/pypaginate
repo_url: https://github.com/CybLow/pypaginate
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024-2025 CybLow

# Strict mode for catching broken links and missing refs
strict: true

# ReadTheDocs theme configuration
theme:
  name: readthedocs
  locale: en
  highlightjs: true
  hljs_languages:
    - python
    - yaml
    - bash
    - json
    - sql
    - javascript

# Navigation structure (2 levels max for RTD theme)
nav:
  - Home: index.md

  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - First Steps: getting-started/first-steps.md

  - Pagination:
      - Overview: user-guide/pagination/index.md
      - Offset Pagination: user-guide/pagination/offset.md
      - Keyset Pagination: user-guide/pagination/keyset.md
      - In-Memory: user-guide/pagination/memory.md

  - Filtering:
      - Overview: user-guide/filtering/index.md
      - Basic Filtering: user-guide/filtering/basic.md
      - JSON Logic: user-guide/filtering/json-logic.md
      - Operators: user-guide/filtering/operators.md

  - Search:
      - Overview: user-guide/search/index.md
      - Text Search: user-guide/search/text-search.md
      - Fuzzy Matching: user-guide/search/fuzzy.md

  - Sorting:
      - Overview: user-guide/sorting/index.md
      - Basic Sorting: user-guide/sorting/basic.md
      - Multi-Column: user-guide/sorting/multi-column.md

  - Integrations:
      - Overview: user-guide/integrations/index.md
      - FastAPI: user-guide/integrations/fastapi.md
      - SQLAlchemy: user-guide/integrations/sqlalchemy.md

  - Concepts:
      - Overview: concepts/index.md
      - Pagination Strategies: concepts/pagination-strategies.md
      - Cursor Encoding: concepts/cursor-encoding.md
      - Filter Expressions: concepts/filter-expressions.md
      - Search & Relevance: concepts/search-relevance.md
      - Architecture: concepts/architecture.md

  - API Reference:
      - Overview: api/index.md
      - Core: api/core.md
      - Engines: api/engines.md
      - Filters: api/filters.md
      - Search: api/search.md
      - Sorting: api/sorting.md
      - Integrations: api/integrations.md
      - Exceptions: api/exceptions.md
      - Query Utilities: api/query.md
      - Text Processing: api/text.md
      - Database Types: api/database.md

  - Examples:
      - Overview: examples/index.md
      - Basic Pagination: examples/basic-pagination.md
      - Filtering: examples/filtering.md
      - FastAPI: examples/fastapi.md
      - Keyset: examples/keyset.md

  - Contributing:
      - Overview: contributing/index.md
      - Development: contributing/development.md
      - Testing: contributing/testing.md
      - Code Style: contributing/code-style.md
      - Architecture: contributing/architecture.md
      - Roadmap: contributing/roadmap.md
      - Code of Conduct: CODE_OF_CONDUCT.md

  - Changelog: changelog.md
  - Comparison: comparison.md

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          import:
            # Cross-reference external libraries
            - https://docs.python.org/3/objects.inv
            - https://docs.sqlalchemy.org/en/20/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
            - https://fastapi.tiangolo.com/objects.inv
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters:
              - "!^_"
              - "!^__"

# Markdown extensions
markdown_extensions:
  # Standard extensions
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section

  # PyMdownx extensions for enhanced formatting
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ['.', 'examples']
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Custom CSS
extra_css:
  - stylesheets/extra.css

# Extra JavaScript for Mermaid diagrams
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

# Watch source files for live reload
watch:
  - src/pypaginate
