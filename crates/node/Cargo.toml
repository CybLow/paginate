[package]
name = "paginate-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "napi-rs (Node-API) bindings exposing paginate-core to Node/TypeScript."
publish = false

[lib]
# cdylib for the Node-API addon (.node). No rlib: the napi entrypoints are not
# meant to be linked into other Rust crates.
crate-type = ["cdylib"]

[dependencies]
paginate-core = { path = "../core" }
# default-features = false keeps the addon lean; napi8 targets Node-API v8
# (Node.js 12.22+/14.x+), serde-json bridges serde_json::Value <-> JS values.
napi = { version = "2", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
