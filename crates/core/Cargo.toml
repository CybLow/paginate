[package]
name = "paginate-core"
# Concrete (not workspace-inherited) so release-please can bump it independently
# for `core-v*` crates.io releases. Other metadata stays workspace-inherited.
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure, language-agnostic pagination / filter / sort / search engine shared by pypaginate (Python) and the future JS/TS port."
keywords = ["pagination", "filter", "sort", "search", "cursor"]
categories = ["algorithms", "data-structures"]
# A single bench target (`benches/main.rs`) wires up the per-subsystem bench
# files; disable auto-discovery so those `mod` files and `benches/common/` are
# not each mistaken for a standalone bench target.
autobenches = false

[lib]
name = "paginate_core"
# Default `rlib` crate type: links natively into the PyO3 binding crate and
# compiles unchanged to wasm32 / napi for the JS/TS port. No binding deps here.

[dependencies]
base64 = { workspace = true }
# Exact arbitrary-precision Decimal compare/eq (the canonical string form parses
# back losslessly); the engine falls back to f64 only when a value is outside
# bigdecimal's domain (e.g. NaN/Infinity), so adding it never regresses.
bigdecimal = "0.4"
regex = { workspace = true }
schemars = { version = "1.0", optional = true }
serde_json = { workspace = true }
shlex = { workspace = true }
# Derives the `Display`/`Error` impls for `CoreError` from the variant
# attributes, keeping the message strings next to the data they format.
thiserror = "2"
unicode-normalization = { workspace = true }

[features]
# Off by default: the published engine carries no schemars dependency. Enables
# the `schema` module + its `export_schema` test, which emits the cross-language
# JSON Schema (the single source of truth for the generated Python / TS types).
schema = ["dep:schemars"]

# docs.rs renders the full API including the `schema` module.
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
proptest = "1.8.0"
criterion = "0.8"

[[bench]]
name = "main"
harness = false

[lints]
workspace = true
