# Dependabot — keeps Python, Rust, Node, and GitHub Actions deps current.
# Monorepo: Python lives in /py, the cargo workspace at /, npm workspaces at /.

version: 2

registries:
  pypi:
    type: python-index
    url: https://pypi.org/simple
    replaces-base: true

updates:
  # ==========================================================================
  # PYTHON (pyproject + uv.lock under /py)
  # ==========================================================================
  - package-ecosystem: "pip"
    directory: "/py"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    registries:
      - pypi
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "CybLow"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "pre-commit"
          - "coverage*"
          - "twine"
          - "build"
        update-types:
          - "minor"
          - "patch"
      runtime:
        patterns:
          - "SQLAlchemy"
          - "fastapi"
          - "pydantic"
          - "msgspec"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "SQLAlchemy"
        update-types: ["version-update:semver-major"]

  # ==========================================================================
  # RUST — cargo workspace (crates/core, crates/node)
  # ==========================================================================
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "CybLow"
    open-pull-requests-limit: 10
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # crates/pyo3 is excluded from the workspace, so it needs its own entry
  # (keeps pyo3 itself current for security fixes).
  - package-ecosystem: "cargo"
    directory: "/crates/pyo3"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 5

  # ==========================================================================
  # NODE / NPM — workspaces (ts, crates/node)
  # ==========================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "node"
    reviewers:
      - "CybLow"
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ==========================================================================
  # GITHUB ACTIONS
  # ==========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
