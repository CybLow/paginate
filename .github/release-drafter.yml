# =============================================================================
# Release Drafter Configuration
# =============================================================================
# Automatically drafts release notes based on PR labels
# See: https://github.com/release-drafter/release-drafter
# =============================================================================

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
tag-prefix: 'v'

# -----------------------------------------------------------------------------
# Categories
# -----------------------------------------------------------------------------

categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking'
      - 'breaking-change'

  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'

  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'

  - title: '⚡ Performance'
    labels:
      - 'performance'
      - 'perf'

  - title: '🔒 Security'
    labels:
      - 'security'

  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'

  - title: '🧪 Tests'
    labels:
      - 'test'
      - 'tests'
      - 'testing'

  - title: '🏗️ CI/CD'
    labels:
      - 'ci'
      - 'github'

  - title: '📦 Dependencies'
    labels:
      - 'dependencies'

  - title: '🔧 Maintenance'
    labels:
      - 'chore'
      - 'maintenance'
      - 'refactor'

# -----------------------------------------------------------------------------
# Version Resolver
# -----------------------------------------------------------------------------

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'documentation'
      - 'chore'
      - 'dependencies'
      - 'performance'
  default: patch

# -----------------------------------------------------------------------------
# Autolabeler
# -----------------------------------------------------------------------------

autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - 'docs/**'
    branch:
      - '/docs\/.+/'

  - label: 'bug'
    branch:
      - '/fix\/.+/'
      - '/bugfix\/.+/'
      - '/hotfix\/.+/'
    title:
      - '/^fix/i'
      - '/^bug/i'

  - label: 'enhancement'
    branch:
      - '/feature\/.+/'
      - '/feat\/.+/'
    title:
      - '/^feat/i'
      - '/^feature/i'

  - label: 'refactor'
    branch:
      - '/refactor\/.+/'
    title:
      - '/^refactor/i'

  - label: 'chore'
    branch:
      - '/chore\/.+/'
    title:
      - '/^chore/i'

  - label: 'tests'
    branch:
      - '/test\/.+/'
    title:
      - '/^test/i'

  - label: 'ci'
    files:
      - '.github/**'
    title:
      - '/^ci/i'

  - label: 'dependencies'
    files:
      - 'pyproject.toml'
      - 'uv.lock'
    title:
      - '/^(chore\(deps\)|deps|dependencies)/i'

# -----------------------------------------------------------------------------
# Exclusions
# -----------------------------------------------------------------------------

exclude-labels:
  - 'skip-changelog'
  - 'no-changelog'
  - 'wontfix'
  - 'duplicate'
  - 'invalid'

exclude-contributors:
  - 'dependabot'
  - 'dependabot[bot]'

# -----------------------------------------------------------------------------
# Template
# -----------------------------------------------------------------------------

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

no-changes-template: 'No changes since the last release.'

replacers:
  # Clean up conventional commit prefixes
  - search: '/^feat(\(.+\))?!?:\s*/i'
    replace: ''
  - search: '/^fix(\(.+\))?!?:\s*/i'
    replace: ''
  - search: '/^docs(\(.+\))?!?:\s*/i'
    replace: ''
  - search: '/^chore(\(.+\))?!?:\s*/i'
    replace: ''
  - search: '/^refactor(\(.+\))?!?:\s*/i'
    replace: ''
  - search: '/^test(\(.+\))?!?:\s*/i'
    replace: ''
  - search: '/^ci(\(.+\))?!?:\s*/i'
    replace: ''
  - search: '/^perf(\(.+\))?!?:\s*/i'
    replace: ''

template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
