# PR Labeler — auto-labels PRs based on changed files
# Matches v0.2 module structure

# -- Source code --
source:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*.py'

api:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/__init__.py'
          - 'src/pypaginate/_dispatch.py'
          - 'src/pypaginate/domain/**'

filtering:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/filtering/**'

sorting:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/sorting/**'

search:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/search/**'

engine:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/engine/**'

adapters:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/adapters/**'

# -- Tests --
tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'

benchmarks:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/perf/**'

# -- Documentation --
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

# -- Infrastructure --
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pyproject.toml'
          - 'uv.lock'

config:
  - changed-files:
      - any-glob-to-any-file:
          - 'pyproject.toml'
          - '.gitignore'
          - '.pre-commit-config.yaml'
          - 'CLAUDE.md'
