# PR Labeler — auto-labels PRs based on changed files (monorepo layout).

# -- Language areas --
python:
  - changed-files:
      - any-glob-to-any-file:
          - 'py/**'
          - 'crates/pyo3/**'

node:
  - changed-files:
      - any-glob-to-any-file:
          - 'ts/**'
          - 'crates/node/**'

rust:
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/**'

core:
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/core/**'

# -- Python module areas --
api:
  - changed-files:
      - any-glob-to-any-file:
          - 'py/src/pypaginate/__init__.py'
          - 'py/src/pypaginate/_dispatch.py'
          - 'py/src/pypaginate/domain/**'

filtering:
  - changed-files:
      - any-glob-to-any-file:
          - 'py/src/pypaginate/filtering/**'
          - 'crates/core/src/filter/**'

sorting:
  - changed-files:
      - any-glob-to-any-file:
          - 'py/src/pypaginate/sorting/**'
          - 'crates/core/src/sort*'

search:
  - changed-files:
      - any-glob-to-any-file:
          - 'py/src/pypaginate/search/**'
          - 'crates/core/src/search/**'

adapters:
  - changed-files:
      - any-glob-to-any-file:
          - 'py/src/pypaginate/adapters/**'
          - 'ts/src/adapters/**'

# -- Tests --
tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'py/tests/**'
          - 'ts/test/**'
          - 'crates/**/tests/**'

benchmarks:
  - changed-files:
      - any-glob-to-any-file:
          - 'py/tests/perf/**'
          - 'crates/core/benches/**'

# -- Documentation --
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
          - 'website/**'

# -- Infrastructure --
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'py/pyproject.toml'
          - 'py/uv.lock'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - '**/Cargo.toml'
          - 'package.json'
          - 'package-lock.json'
          - '**/package.json'

config:
  - changed-files:
      - any-glob-to-any-file:
          - 'py/pyproject.toml'
          - '.gitignore'
          - '.pre-commit-config.yaml'
          - 'release-please-config.json'
          - 'commitlint.config.js'
          - 'CLAUDE.md'
