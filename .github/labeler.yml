# =============================================================================
# PR Labeler Configuration
# =============================================================================
# Automatically labels PRs based on files changed
# See: https://github.com/actions/labeler
# =============================================================================

# -----------------------------------------------------------------------------
# Code Labels
# -----------------------------------------------------------------------------

# Core source code changes
source:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*.py'

# API changes
api:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/__init__.py'
          - 'src/pypaginate/core/**'

# Filter system
filters:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/filters/**'

# Sorting system
sorting:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/sorting/**'

# Engine implementations
engines:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/engines/**'

# Integrations (FastAPI, SQLAlchemy, etc.)
integrations:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/pypaginate/integrations/**'
          - 'src/pypaginate/contrib/**'

# -----------------------------------------------------------------------------
# Test Labels
# -----------------------------------------------------------------------------

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'

unit-tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/unit/**'

integration-tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/integration/**'

property-tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/property/**'

benchmarks:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/benchmarks/**'

e2e:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/e2e/**'

# -----------------------------------------------------------------------------
# Documentation Labels
# -----------------------------------------------------------------------------

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
          - 'mkdocs.yml'

examples:
  - changed-files:
      - any-glob-to-any-file:
          - 'examples/**'

# -----------------------------------------------------------------------------
# Infrastructure Labels
# -----------------------------------------------------------------------------

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'

github:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pyproject.toml'
          - 'uv.lock'
          - 'requirements*.txt'

config:
  - changed-files:
      - any-glob-to-any-file:
          - 'pyproject.toml'
          - '.editorconfig'
          - '.gitignore'
          - '.pre-commit-config.yaml'
          - 'ruff.toml'
          - 'mypy.ini'

# -----------------------------------------------------------------------------
# OpenCode / AI Agent Labels
# -----------------------------------------------------------------------------

opencode:
  - changed-files:
      - any-glob-to-any-file:
          - '.opencode/**'
          - 'AGENTS.md'

# -----------------------------------------------------------------------------
# Size Labels (based on lines changed)
# -----------------------------------------------------------------------------

size/XS:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*'
    all:
      - changed-files:
          - total-lines-changed:
              less-than: 10

size/S:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*'
    all:
      - changed-files:
          - total-lines-changed:
              greater-than-or-equal-to: 10
              less-than: 50

size/M:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*'
    all:
      - changed-files:
          - total-lines-changed:
              greater-than-or-equal-to: 50
              less-than: 200

size/L:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*'
    all:
      - changed-files:
          - total-lines-changed:
              greater-than-or-equal-to: 200
              less-than: 500

size/XL:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*'
    all:
      - changed-files:
          - total-lines-changed:
              greater-than-or-equal-to: 500
