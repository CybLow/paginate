# =============================================================================
# CI/CD Pipeline - pypaginate
# =============================================================================
# Enhanced test infrastructure with parallel execution, property tests,
# benchmarks, and improved coverage reporting.
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
      - 'feature/*'
      - 'fix/*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - 'LICENSE'

  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: false
        type: boolean
      run_slow:
        description: 'Run slow tests'
        required: false
        default: false
        type: boolean
      run_benchmarks:
        description: 'Run benchmark tests'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.11'
  UV_SYSTEM_PYTHON: 1
  PYTEST_ADDOPTS: '--color=yes'
  HYPOTHESIS_PROFILE: 'ci'

# =============================================================================
# JOBS
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Quality Checks (Lint + Format + Type Check)
  # ---------------------------------------------------------------------------
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft != true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup UV + Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --group lint --group type

      - name: Check formatting
        run: uv run ruff format --check --diff src tests

      - name: Lint
        run: uv run ruff check --output-format=github src tests

      - name: Type check
        run: uv run mypy src

  # ---------------------------------------------------------------------------
  # Unit Tests (Fast, Parallel Execution)
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit Tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup UV + Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --group test

      - name: Run unit tests (parallel)
        run: |
          uv run pytest tests/ \
            -n auto \
            --dist loadgroup \
            -p no:benchmark \
            --cov=pypaginate \
            --cov-report=xml:coverage-unit-${{ matrix.python }}.xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=junit-unit-${{ matrix.python }}.xml \
            -v \
            --ignore=tests/benchmarks \
            --ignore=tests/e2e

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-unit-${{ matrix.python }}.xml
          flags: unit,python-${{ matrix.python }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results-py${{ matrix.python }}
          path: |
            junit-unit-*.xml
            coverage-unit-*.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Integration Tests (Cross-platform)
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration Tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: test-unit

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup UV + Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --group test

      - name: Run integration tests
        run: uv run pytest tests/ --benchmark-disable --cov=pypaginate --cov-report=xml:coverage-integration-${{ matrix.os }}.xml --cov-report=term-missing:skip-covered --junitxml=junit-integration-${{ matrix.os }}.xml -v --ignore=tests/benchmarks --ignore=tests/e2e --reruns 2 --reruns-delay 1

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration-${{ matrix.os }}.xml
          flags: integration,${{ matrix.os }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results-${{ matrix.os }}
          path: |
            junit-integration-*.xml
            coverage-integration-*.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Property-Based Tests (Hypothesis)
  # ---------------------------------------------------------------------------
  test-property:
    name: Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup UV + Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --group test

      - name: Run property tests
        run: |
          uv run pytest tests/property \
            -m property \
            --benchmark-disable \
            --hypothesis-seed=random \
            --junitxml=junit-property.xml \
            -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-results
          path: junit-property.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Benchmark Tests (Performance Tracking)
  # ---------------------------------------------------------------------------
  test-benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event.inputs.run_benchmarks == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup UV + Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --group test

      - name: Run benchmarks
        run: |
          uv run pytest tests/benchmarks \
            --run-benchmark \
            --benchmark-enable \
            --benchmark-json=benchmark-results.json \
            --benchmark-autosave \
            -v

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            .benchmarks/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Build Package
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-unit, test-integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup UV + Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: uv sync --frozen --group build

      - name: Build package
        run: uv build

      - name: Verify with twine
        run: uv run twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Security Scan
  # ---------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup UV + Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Bandit security scan
        run: uv run bandit -r src -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Coverage Report (Combined)
  # ---------------------------------------------------------------------------
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-unit, test-integration]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-results-*'
          merge-multiple: true

      - name: Setup UV + Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Generate coverage report
        run: |
          uv run coverage combine coverage-*.xml || echo "No coverage files to combine"
          uv run coverage report --fail-under=85 || echo "Coverage below threshold"
          uv run coverage html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # CI Status Gate
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI ✓
    runs-on: ubuntu-latest
    needs: [quality, test-unit, test-integration, build]
    if: always()

    steps:
      - name: Check results
        run: |
          results=("${{ needs.quality.result }}" "${{ needs.test-unit.result }}" \
                   "${{ needs.test-integration.result }}" "${{ needs.build.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "❌ CI failed: $result"; exit 1
            fi
          done
          echo "✅ All checks passed!"
