# =============================================================================
# CI — paginate monorepo (Rust engine + Python & Node/TS adapters)
# =============================================================================
# Trunk-based: runs on PRs to `main` and pushes to `main`. A path-filter
# (`changes`) gates each language lane. Because crates/core is the SHARED engine,
# any change under it fans out to the Python matrix, the TS suite, AND the
# cross-language parity job.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Force all lanes regardless of changed paths'
        type: boolean
        default: false
      run_benchmarks:
        description: 'Run benchmark tests'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.11'
  PYTEST_ADDOPTS: '--color=yes'
  HYPOTHESIS_PROFILE: 'ci'

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — which lanes run. crates/core fans out to py + node + parity.
  # ---------------------------------------------------------------------------
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      py: ${{ steps.f.outputs.py == 'true' || steps.force.outputs.all == 'true' }}
      rust: ${{ steps.f.outputs.rust == 'true' || steps.force.outputs.all == 'true' }}
      core: ${{ steps.f.outputs.core == 'true' || steps.force.outputs.all == 'true' }}
      node: ${{ steps.f.outputs.node == 'true' || steps.force.outputs.all == 'true' }}
      bench: ${{ steps.f.outputs.bench == 'true' || steps.force.outputs.all == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_benchmarks) }}
    steps:
      - uses: actions/checkout@v6
      - id: force
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_all_tests }}" == "true" ]] \
             || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            py:
              - 'py/**'
              - 'crates/pyo3/**'
              - 'crates/core/**'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            core:
              - 'crates/core/**'
            node:
              - 'crates/node/**'
              - 'ts/**'
              - 'crates/core/**'
              - 'package.json'
            bench:
              - 'py/**'
              - 'crates/core/**'

  # ---------------------------------------------------------------------------
  # Rust — fmt + clippy + test (workspace + the excluded pyo3 crate), debug+release
  # ---------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/pyo3 -> target
      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/pyo3/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path crates/pyo3/Cargo.toml --all-targets -- -D warnings
      - name: Test (debug)
        run: cargo test --workspace
      - name: Test (release)
        run: cargo test --workspace --release

  # ---------------------------------------------------------------------------
  # Python — quality (ruff + mypy); no project build needed (analyzes source)
  # ---------------------------------------------------------------------------
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.py == 'true' && github.event.pull_request.draft != true
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (deps only)
        run: uv sync --frozen --all-extras --group lint --group type --no-install-project
      - name: Format check
        run: uv run ruff format --check --diff src tests
      - name: Lint
        run: uv run ruff check --output-format=github src tests
      - name: Type check
        run: uv run mypy src

  # ---------------------------------------------------------------------------
  # Python — architecture gates
  # ---------------------------------------------------------------------------
  test-architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [changes, quality]
    if: needs.changes.outputs.py == 'true'
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pyo3 -> target
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build ext + install
        run: uv sync --frozen --all-extras --group test
      - name: Architecture tests
        run: uv run pytest tests/architecture -p no:benchmark --junitxml=junit-architecture.xml -v
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-results
          path: py/junit-architecture.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Python — unit tests (abi3 ext built per matrix cell)
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit / Py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [changes, quality]
    if: needs.changes.outputs.py == 'true'
    defaults:
      run:
        shell: bash
        working-directory: py
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pyo3 -> target
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ matrix.python }}
      - name: Build ext + install
        run: uv sync --frozen --all-extras --group test
      - name: Unit tests (parallel)
        run: |
          uv run pytest tests/ \
            -n auto --dist loadgroup -p no:benchmark \
            --cov=pypaginate --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=junit-unit.xml -v \
            --reruns 2 --reruns-delay 1 \
            --ignore=tests/perf --ignore=tests/e2e
      - name: Coverage → Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: py/coverage-unit.xml
          flags: unit,python-${{ matrix.python }}
          fail_ci_if_error: false
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-results-py${{ matrix.python }}-${{ matrix.os }}
          path: |
            py/junit-unit.xml
            py/coverage-unit.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Python — integration (cross-platform)
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration / Py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [changes, test-unit]
    if: needs.changes.outputs.py == 'true'
    defaults:
      run:
        shell: bash
        working-directory: py
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pyo3 -> target
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ matrix.python }}
      - name: Build ext + install
        run: uv sync --frozen --all-extras --group test
      - name: Integration tests
        run: |
          uv run pytest tests/ \
            --benchmark-disable \
            --cov=pypaginate --cov-report=xml:coverage-integration.xml \
            --junitxml=junit-integration.xml -v \
            --ignore=tests/perf --ignore=tests/e2e \
            --reruns 2 --reruns-delay 1
      - name: Coverage → Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: py/coverage-integration.xml
          flags: integration,python-${{ matrix.python }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Python — E2E (FastAPI journeys)
  # ---------------------------------------------------------------------------
  test-e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes, test-unit]
    if: needs.changes.outputs.py == 'true'
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pyo3 -> target
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build ext + install
        run: uv sync --frozen --all-extras --group test
      - name: E2E tests
        run: uv run pytest tests/e2e -p no:benchmark --junitxml=junit-e2e.xml -v

  # ---------------------------------------------------------------------------
  # Python — PostgreSQL integration
  # ---------------------------------------------------------------------------
  test-postgresql:
    name: PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes, test-unit]
    if: needs.changes.outputs.py == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pypaginate
          POSTGRES_PASSWORD: pypaginate
          POSTGRES_DB: pypaginate_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pypaginate"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PYPAGINATE_PG_URL: postgresql+asyncpg://pypaginate:pypaginate@localhost:5433/pypaginate_test
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pyo3 -> target
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build ext + install
        run: uv sync --frozen --all-extras --group test
      - name: PostgreSQL tests
        run: uv run pytest tests/integration/test_postgresql.py --benchmark-disable --junitxml=junit-postgresql.xml -v

  # ---------------------------------------------------------------------------
  # Python — property tests (Hypothesis)
  # ---------------------------------------------------------------------------
  test-property:
    name: Property
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, test-unit]
    if: needs.changes.outputs.py == 'true'
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pyo3 -> target
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build ext + install
        run: uv sync --frozen --all-extras --group test
      - name: Property tests
        run: uv run pytest tests/property -m property --benchmark-disable --hypothesis-seed=random --junitxml=junit-property.xml -v

  # ---------------------------------------------------------------------------
  # Node/TS — napi addon build + TS suite (parity-aware)
  # ---------------------------------------------------------------------------
  node-ts:
    name: Node / TS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.node == 'true' && github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/node -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspaces
        run: bun install
      - name: Test (builds the napi addon, then bun test)
        run: cd ts && bun run test

  # ---------------------------------------------------------------------------
  # Parity — cross-language byte-identical behaviour (runs when the engine changes)
  # ---------------------------------------------------------------------------
  parity:
    name: Parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.core == 'true' && github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/pyo3 -> target
            crates/node -> target
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Rust engine invariants + shared-fixture parity
        run: cargo test -p paginate-core
      - name: Python ↔ engine parity (+ shared cross-language fixture)
        working-directory: py
        run: |
          uv sync --frozen --all-extras --group test
          uv run pytest \
            tests/property/test_dataset_parity.py \
            tests/property/test_cross_language_parity.py -v
      - name: TS ↔ Python codec parity (byte-identical cursors + shared fixture)
        run: |
          bun install
          cd ts && bun run test

  # ---------------------------------------------------------------------------
  # Build — Python wheel + sdist smoke (maturin via uv build)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes, test-unit]
    if: needs.changes.outputs.py == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pyo3 -> target
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel (maturin, in-place)
        # uv build uses build isolation (copies only py/), so it can't see the
        # sibling ../crates. maturin builds in-place and reads manifest-path, like
        # release-python.yml. (sdist packaging is exercised by release-python.yml.)
        working-directory: py
        run: uvx maturin build --out dist
      - name: twine check
        run: uvx twine check py/dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: py/dist/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Security — bandit (Python source)
  # ---------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.py == 'true'
    permissions:
      security-events: write
      contents: read
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (deps only)
        run: uv sync --frozen --group security --no-install-project
      - name: Bandit
        run: |
          uv run bandit -r src -f sarif -o bandit-results.sarif || true
          uv run bandit -r src -f json -o bandit-report.json || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('py/bandit-results.sarif') != ''
        with:
          sarif_file: py/bandit-results.sarif
          category: bandit
      - name: pip-audit
        run: uv run pip-audit --format=json --output=pip-audit-report.json || true
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Benchmarks — pytest-benchmark + gh-pages dashboard (engine/py changes)
  # ---------------------------------------------------------------------------
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, test-unit]
    if: needs.changes.outputs.bench == 'true' && github.event.pull_request.draft != true
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pyo3 -> target
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build ext (release) + install
        run: |
          uv sync --frozen --all-extras --group test
          uv run --with maturin maturin develop --release
      - name: Run benchmarks
        run: |
          uv run pytest tests/perf \
            --run-benchmark --run-slow --benchmark-enable \
            --benchmark-json=benchmark-results.json --benchmark-autosave -v
      - name: Continuous benchmark
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: py/benchmark-results.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          comment-always: ${{ github.event_name == 'pull_request' }}
          alert-threshold: '120%'
          fail-on-alert: false
      - name: Deploy benchmark dashboard
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          SHA=$(gh api /repos/{owner}/{repo}/contents/dev/bench/index.html?ref=gh-pages --jq '.sha' 2>/dev/null || echo "")
          CONTENT=$(base64 -w0 .github/pages/bench/index.html)
          if [ -n "$SHA" ]; then
            gh api /repos/{owner}/{repo}/contents/dev/bench/index.html --method PUT \
              -f message="chore: update benchmark dashboard" -f content="$CONTENT" -f sha="$SHA" -f branch=gh-pages
          else
            gh api /repos/{owner}/{repo}/contents/dev/bench/index.html --method PUT \
              -f message="chore: add benchmark dashboard" -f content="$CONTENT" -f branch=gh-pages
          fi

  # ---------------------------------------------------------------------------
  # CI Status Gate — the single required check. Skipped lanes count as pass.
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI ✓
    runs-on: ubuntu-latest
    needs: [changes, rust, quality, test-architecture, test-unit, test-integration, test-e2e, test-postgresql, test-property, node-ts, parity, build, security]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Results: rust=${{ needs.rust.result }} quality=${{ needs.quality.result }} arch=${{ needs.test-architecture.result }} unit=${{ needs.test-unit.result }} integration=${{ needs.test-integration.result }} e2e=${{ needs.test-e2e.result }} pg=${{ needs.test-postgresql.result }} property=${{ needs.test-property.result }} node-ts=${{ needs.node-ts.result }} parity=${{ needs.parity.result }} build=${{ needs.build.result }} security=${{ needs.security.result }}"
          # Every lane is path-gated, so "skipped" is an allowed (passing) state.
          # Only an explicit failure/cancellation fails the gate.
          ALL=(\
            "${{ needs.rust.result }}" "${{ needs.quality.result }}" "${{ needs.test-architecture.result }}" \
            "${{ needs.test-unit.result }}" "${{ needs.test-integration.result }}" "${{ needs.test-e2e.result }}" \
            "${{ needs.test-postgresql.result }}" "${{ needs.test-property.result }}" "${{ needs.node-ts.result }}" \
            "${{ needs.parity.result }}" "${{ needs.build.result }}" "${{ needs.security.result }}")
          for r in "${ALL[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "❌ lane failed: $r"; exit 1
            fi
          done
          echo "✅ all required lanes passed (or were correctly skipped)"
