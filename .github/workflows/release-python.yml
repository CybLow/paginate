# =============================================================================
# Release: Python wheel (pypaginate) → PyPI
# =============================================================================
# Trigger: tag `py-v*` (cut by release-please), or workflow_dispatch.
# Builds multi-platform abi3 wheels (CPython 3.11+) with maturin, plus an sdist,
# then publishes via PyPI Trusted Publishing (OIDC, no tokens). Prerelease tags
# (py-v*-rc*) and `dry_run=true` dispatches go to TestPyPI; a `dry_run=false`
# dispatch publishes to real PyPI. Attaches a CycloneDX SBOM + SLSA provenance.
#
# maturin reads py/pyproject.toml ([tool.maturin] manifest-path = crates/pyo3),
# so all steps run with working-directory: py.
# =============================================================================

name: Release Python

on:
  push:
    tags: ['py-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true → publish to TestPyPI · false → publish to real PyPI'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-wheels:
    name: 🛞 wheel ${{ matrix.target }} ${{ matrix.manylinux }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,  target: x86_64,  manylinux: auto }
          - { runner: ubuntu-latest,  target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest,  target: x86_64,  manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest,  target: aarch64, manylinux: musllinux_1_2 }
          - { runner: macos-latest,   target: x86_64,  manylinux: '' }  # cross-compiled on arm64 (no scarce macos-13 Intel runner)
          - { runner: macos-latest,   target: aarch64, manylinux: '' }
          - { runner: windows-latest, target: x64,     manylinux: '' }
          - { runner: windows-latest, target: aarch64, manylinux: '' }  # Windows on ARM64
    steps:
      - uses: actions/checkout@v6
      - name: 🛠 Build wheel (maturin)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: py/dist/*.whl

  build-sdist:
    name: 📦 sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 🛠 Build sdist (vendors crates/* path deps)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: py/dist/*.tar.gz

  verify:
    name: ✅ twine check + SBOM
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'wheels-*'
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: ✅ twine check
        run: uvx twine check dist/*
      - name: 📜 Generate SBOM (CycloneDX)
        run: |
          uvx --from cyclonedx-bom cyclonedx-py environment --of json -o sbom.json py/.venv || \
          uvx --from cyclonedx-bom cyclonedx-py requirements py/uv.lock --of json -o sbom.json || true
      - name: 🔏 SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-verified
          path: dist/

  publish:
    name: 🚀 ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'TestPyPI' || (contains(github.ref_name, '-rc') && 'TestPyPI' || 'PyPI') }}
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      id-token: write
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'testpypi' || (contains(github.ref_name, '-rc') && 'testpypi' || 'pypi') }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-verified
          path: dist/
      - name: 🚀 Publish to TestPyPI
        if: (github.event_name == 'workflow_dispatch' && inputs.dry_run) || contains(github.ref_name, '-rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: 🚀 Publish to PyPI
        # Real PyPI on a `py-v*` tag push, or an explicit non-dry-run dispatch
        # (the only path available when a tag push isn't possible).
        if: (github.event_name == 'push' && !contains(github.ref_name, '-rc')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        uses: pypa/gh-action-pypi-publish@release/v1
