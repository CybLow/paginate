# =============================================================================
# Release Please — opens/maintains per-package "Release" PRs from Conventional
# Commits, and on merge tags core-vX / py-vX / ts-vX (config:
# release-please-config.json, state: .release-please-manifest.json).
#
# IMPORTANT: the default GITHUB_TOKEN cannot trigger other workflows, so tags it
# creates would NOT fire release-python/npm/crate. Add a PAT (or GitHub App
# token) as the RELEASE_PLEASE_TOKEN secret to get fully-automated publishing.
# Without it, Release PRs + tags are still created — just trigger the publish
# workflows manually (push the tag, or `gh workflow run`).
# =============================================================================

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
