# =============================================================================
# Documentation — paginate monorepo
# =============================================================================
# Builds the unified Docusaurus site (website/) and deploys it to GitHub Pages.
# The TypeScript API reference is generated by TypeDoc during the build (using the
# published @cyblow/paginate-core types), and the Python API reference by
# pydoc-markdown (which parses py/src statically) — so no Rust/maturin toolchain
# is needed here. Preserves /dev/bench and /status pushed by other CI jobs.
# =============================================================================

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'ts/src/**'
      - 'py/src/pypaginate/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'ts/src/**'
      - 'py/src/pypaginate/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup uv (for pydoc-markdown)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # TypeDoc resolves @cyblow/paginate-core's published types from ts/node_modules.
      - name: Install TS deps (for the TypeScript API reference)
        working-directory: ts
        run: bun install # ts/ has no committed lockfile

      - name: Install site deps
        working-directory: website
        run: bun install --frozen-lockfile

      # gen:python (pydoc-markdown) -> typedoc (in build) -> docusaurus build
      - name: Build site
        working-directory: website
        run: bun run build:full

      - name: Upload build artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: website/build/
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/build
          clean-exclude: |
            dev/bench
            status
