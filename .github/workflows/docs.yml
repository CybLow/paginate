# =============================================================================
# Documentation Deployment — paginate monorepo
# =============================================================================
# Builds the Sphinx site from py/docs and deploys to GitHub Pages (gh-pages),
# preserving /dev/bench/ (benchmark charts) and /status/ pushed by CI.
# The build needs the Rust toolchain because autodoc imports the compiled
# pypaginate._core extension.
# =============================================================================

name: Documentation

on:
  push:
    branches: [main]
    tags: ['py-v*']
    paths:
      - 'py/docs/**'
      - 'py/src/pypaginate/**'
      - 'crates/**'
      - '.github/workflows/docs.yml'
      - 'py/pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'py/docs/**'
      - 'py/src/pypaginate/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for sphinx-polyversion

      - name: Rust toolchain (for the native extension)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pyo3 -> target

      - name: Setup UV + Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (builds pypaginate._core)
        working-directory: py
        run: uv sync --frozen --group docs --all-extras

      - name: Build documentation
        working-directory: py
        run: |
          if uv run sphinx-polyversion docs/poly.py 2>/dev/null; then
            echo "Multi-version build successful"
            # polyversion writes under py/site; hoist to the workspace root
            [ -d site ] && cp -r site "$GITHUB_WORKSPACE/site"
          else
            echo "Single-version build..."
            uv run sphinx-build -b html docs "$GITHUB_WORKSPACE/site"
          fi

      - name: Create root index.html redirect
        run: |
          if [ -d "site/main" ]; then
            cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting to pypaginate documentation</title>
            <meta http-equiv="refresh" content="0; url=./main/">
            <link rel="canonical" href="https://cyblow.github.io/paginate/main/">
          </head>
          <body>
            <p>Redirecting to <a href="./main/">pypaginate documentation</a>...</p>
          </body>
          </html>
          EOF
          fi

      - name: Create .nojekyll
        run: touch site/.nojekyll

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: site/
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          clean-exclude: |
            dev/bench
            status
