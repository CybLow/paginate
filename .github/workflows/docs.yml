# =============================================================================
# Documentation Deployment - pypaginate
# =============================================================================
# Builds and deploys Sphinx documentation to GitHub Pages
# Uses sphinx-polyversion for multi-version documentation
# =============================================================================

name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'  # Trigger on version tags
    paths:
      - 'docs/**'
      - 'src/pypaginate/**'
      - '.github/workflows/docs.yml'
      - 'pyproject.toml'

  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/pypaginate/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for sphinx-polyversion

      - name: 🐍 Setup UV + Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --frozen --group docs --all-extras

      - name: 🏗️ Build documentation
        run: |
          # Try multi-version build first
          if uv run sphinx-polyversion docs/poly.py 2>/dev/null; then
            echo "Multi-version build successful"
          else
            echo "No matching refs found or polyversion failed, building single version..."
            uv run sphinx-build -b html docs site
          fi

      - name: 📄 Create root index.html redirect
        run: |
          # Create redirect from root to main (or latest tag)
          if [ -d "site/main" ]; then
            cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting to pypaginate documentation</title>
            <meta http-equiv="refresh" content="0; url=./main/">
            <link rel="canonical" href="https://cyblow.github.io/pypaginate/main/">
          </head>
          <body>
            <p>Redirecting to <a href="./main/">pypaginate documentation</a>...</p>
          </body>
          </html>
          EOF
          fi

      - name: 📄 Create .nojekyll
        run: touch site/.nojekyll

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
