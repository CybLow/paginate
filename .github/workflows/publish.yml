# =============================================================================
# Publish to PyPI / TestPyPI
# =============================================================================
# Trigger: GitHub Release (published)
# Uses: Trusted Publishing (OIDC) - no tokens required
# =============================================================================

name: Publish

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
      dry-run:
        description: 'Dry run (build only)'
        required: false
        default: false
        type: boolean

# Global: lecture seule. Les droits élevés sont "job-scopés".
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install build tools
        run: uv sync --frozen --group build

      - name: 🏗️ Build
        run: uv build

      - name: ✅ Verify
        run: uv run twine check dist/*

      - name: 📋 Get version
        id: version
        run: |
          VERSION=$(uv run python -c "from importlib.metadata import version; print(version('pypaginator'))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: 📤 Upload
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Publish to TestPyPI
  # ---------------------------------------------------------------------------
  testpypi:
    name: 🧪 TestPyPI
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    if: |
      (github.event_name == 'release' && github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && !inputs.dry-run)

    environment:
      name: testpypi
      url: https://test.pypi.org/project/pypaginator

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: 🚀 Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Publish to PyPI
  # ---------------------------------------------------------------------------
  pypi:
    name: 🚀 PyPI
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    if: |
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' && !inputs.dry-run)

    environment:
      name: pypi
      url: https://pypi.org/project/pypaginator

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: 🚀 Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ---------------------------------------------------------------------------
  # Upload Release Assets
  # ---------------------------------------------------------------------------
  assets:
    name: 📎 Release Assets
    runs-on: ubuntu-latest
    needs: [build, pypi]
    permissions:
      contents: write
    if: github.event_name == 'release' && !github.event.release.prerelease

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: 📤 Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
