# =============================================================================
# Release: Node/TS package (@cyblow/paginate) + napi addon (paginate-core) → npm
# =============================================================================
# Trigger: tag `ts-v*` (cut by release-please). Dry-run via workflow_dispatch.
# Builds the napi addon for every target, then `napi prepublish` publishes
# `paginate-core` + its platform sub-packages, and finally `@cyblow/paginate`.
# =============================================================================

name: Release npm

on:
  push:
    tags: ['ts-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run only'
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: crates/node

jobs:
  build:
    name: 🧩 addon ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest,   target: x86_64-apple-darwin }   # cross-compiled on arm64 (no scarce macos-13 Intel runner)
          - { host: macos-latest,   target: aarch64-apple-darwin }
          - { host: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { host: ubuntu-latest,  target: x86_64-unknown-linux-musl,  cross: true }
          - { host: ubuntu-latest,  target: aarch64-unknown-linux-musl, cross: true }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: 🦀 Rust toolchain
        run: rustup target add ${{ matrix.target }}
      - run: npm ci || npm install
      - name: 🔗 aarch64-linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: ⚡ Zig (musl cross-link)
        if: matrix.cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: 🔧 cargo-zigbuild
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: 🛠 napi build
        # napi v3 dropped `--zig`; musl targets cross-compile via cargo-zigbuild (`-x`).
        run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.cross && '-x' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.target }}
          path: |
            crates/node/*.node
            crates/node/index.js
            crates/node/index.d.ts

  publish:
    name: 🚀 npm ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '(dry-run)' || '' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: 📥 Collect built addons
        uses: actions/download-artifact@v8
        with:
          path: crates/node/artifacts
          pattern: addon-*
      - run: npm ci || npm install
      - name: 📦 Create npm dirs + stage artifacts
        run: |
          # Place the napi-generated JS bindings so the MAIN paginate-core package
          # (published below) ships its loader (index.js/index.d.ts).
          cp artifacts/*/index.js artifacts/*/index.d.ts . 2>/dev/null || true
          npx napi create-npm-dirs -t .
          npx napi artifacts -d artifacts
      - name: 🚀 Publish paginate-core (+ platform sub-packages)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # napi prepublish ships the platform sub-packages and adds their
          # optionalDependencies to package.json; then publish the MAIN wrapper
          # package itself (--ignore-scripts so prepublishOnly doesn't re-run).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx napi prepublish -t npm --dry-run --skip-gh-release
            npm publish --access public --dry-run --ignore-scripts
          else
            npx napi prepublish -t npm --skip-gh-release
            npm publish --access public --ignore-scripts
          fi
      - name: 🚀 Publish @cyblow/paginate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Resolve paginate-core from the local workspace, not the registry: in a
          # dry-run it isn't published yet, and even on a real release the registry
          # copy can lag. Place the napi-generated JS bindings into crates/node so
          # tsc can find the types, then install + build via the root workspace.
          cp artifacts/*/index.js artifacts/*/index.d.ts . 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          npm install
          npm --prefix ts run build
          # Publish from inside ts/ (NOT `npm --prefix ts` from the workspace root,
          # which reads the root's "private": true and fails with EPRIVATE).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ( cd ts && npm publish --access public --dry-run )
          else
            ( cd ts && npm publish --access public )
          fi
